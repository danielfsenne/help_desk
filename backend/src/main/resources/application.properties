spring.application.name=helpdesk

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/helpdesk
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:help-desk-dev-secret-troque-em-producao-0123456789abcdef}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
